name: Keep Supabase Active

on:
  schedule:
    # Runs at 12:00 UTC on Mondays and Thursdays (every ~3 days)
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase API
        run: |
          curl -X GET "https://gcmodcwrdfclctgigkdg.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
